[package]
name = "tauri-plugin-paylas"
version = "0.1.0"
description = "Paratoner Saha: dosyayı Android paylaşma penceresiyle gönderme ve telefona kaydetme"
authors = ["Buğra Güngöz"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-paylas"
publish = false

[dependencies]
tauri = { version = "2.11.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
