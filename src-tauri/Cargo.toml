[package]
name = "app"
version = "1.9.1"
description = "Paratoner Risk Analizi — NF C 17-102 esaslı aktif paratoner koruma analizi"
authors = ["Buğra Güngöz"]
license = "GPL-3.0-or-later"
repository = "https://github.com/bugragungoz/paratoner-risk-analizi"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
keyring = { version = "3.6", features = ["windows-native"] }
tauri-plugin-single-instance = "2.4"
